name: install

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace layout
        run: |
          test -d packages/types
          test -d packages/config
          test -d packages/validators
          test -d packages/stellar-kit
          test -d packages/anchor-utils
          test -d apps/web
          test -d contracts/treasury-escrow/src
          test -d docs
          test -d examples
          test -d .github/workflows
